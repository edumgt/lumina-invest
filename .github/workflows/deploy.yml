# main에 push되면 EC2 한 대(docker compose 단일 서버)로 이 repo를 그대로 rsync하고
# 컨테이너를 재빌드·재기동한다.
#
# 서버에 미리 있어야 하는 것
#   - Docker Engine + Compose v2 (sudo 또는 docker 그룹)
#   - <APP_DIR>/.env  ← git에 없으므로(.gitignore) 서버에서 직접 작성. 배포 시 절대 덮어쓰지 않는다.
#
# GitHub 저장소 설정 (Settings → Secrets and variables → Actions)
#   Secrets : FUND_WEB_SSH_KEY   EC2 접속용 개인키(PEM 전문)
#   Variables: FUND_WEB_HOST     EC2 퍼블릭 IP 또는 DNS
#              FUND_WEB_USER     SSH 사용자 (예: ubuntu)
#              FUND_WEB_APP_DIR  (선택) 서버 배포 경로, 기본 /home/<USER>/lumina-invest
#              FUND_WEB_COMPOSE_FILE (선택) compose 파일 목록(콜론 구분). 기본 docker-compose.yml
#                                   운영(fd.edumgt.co.kr): docker-compose.yml:compose.fd.yml
#              FUND_WEB_DOMAIN   (선택) 있으면 https://<DOMAIN>/api/health 도 추가로 확인
name: Deploy to fund-web EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 배포가 겹치지 않도록 직렬화 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test          # 단위 테스트 통과 후에만 배포
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ vars.FUND_WEB_HOST }}
      SSH_USER: ${{ vars.FUND_WEB_USER }}
      APP_DIR: ${{ vars.FUND_WEB_APP_DIR || format('/home/{0}/lumina-invest', vars.FUND_WEB_USER) }}
      COMPOSE_FILE: ${{ vars.FUND_WEB_COMPOSE_FILE || 'docker-compose.yml' }}
      SSH_OPTS: -i ~/.ssh/fund-web.pem -o StrictHostKeyChecking=yes -o ServerAliveInterval=30
    steps:
      - uses: actions/checkout@v4

      - name: 필수 설정 확인
        env:
          SSH_KEY: ${{ secrets.FUND_WEB_SSH_KEY }}
        run: |
          missing=0
          [ -n "${SSH_HOST}" ] || { echo "::error::Variable FUND_WEB_HOST 가 비어 있습니다"; missing=1; }
          [ -n "${SSH_USER}" ] || { echo "::error::Variable FUND_WEB_USER 가 비어 있습니다"; missing=1; }
          [ -n "${SSH_KEY}" ]  || { echo "::error::Secret FUND_WEB_SSH_KEY 가 비어 있습니다"; missing=1; }
          [ "$missing" = 0 ]

      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.FUND_WEB_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/fund-web.pem
          chmod 600 ~/.ssh/fund-web.pem
          ssh-keyscan -T 10 -H "${SSH_HOST}" > ~/.ssh/known_hosts 2>/dev/null || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::${SSH_HOST}:22 에 접속할 수 없습니다. EC2 보안 그룹에서 GitHub Actions 러너(또는 0.0.0.0/0)의 22번 포트 인바운드를 허용하세요."
            exit 1
          fi

      - name: 서버 사전 점검 (docker · 배포 경로 · .env · shared-net)
        run: |
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" bash -s -- "${APP_DIR}" "${COMPOSE_FILE}" <<'REMOTE'
            set -euo pipefail
            APP_DIR="$1"; COMPOSE_FILE="$2"
            command -v docker >/dev/null || { echo "::error::서버에 docker 가 없습니다"; exit 1; }
            sudo docker compose version >/dev/null || { echo "::error::docker compose v2 가 없습니다"; exit 1; }
            mkdir -p "${APP_DIR}"
            if [ ! -f "${APP_DIR}/.env" ]; then
              echo "::error::${APP_DIR}/.env 가 없습니다. 서버에서 .env.example 을 참고해 먼저 작성하세요."
              exit 1
            fi
            # compose 가 external 네트워크로 요구하는 shared-net 보장
            sudo docker network inspect shared-net >/dev/null 2>&1 || sudo docker network create shared-net
            echo "사전 점검 OK: ${APP_DIR} (COMPOSE_FILE=${COMPOSE_FILE})"
          REMOTE

      - name: 코드 동기화 (.env·데이터·볼륨은 서버 것 그대로 유지)
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.dev' \
            --exclude='data/' \
            --exclude='terraform/.terraform' \
            --exclude='infra/**/.terraform' \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            -e "ssh ${SSH_OPTS}" \
            ./ "${SSH_USER}@${SSH_HOST}:${APP_DIR}/"

      # 주의: sudo -E 로 COMPOSE_FILE 을 넘기면 안 된다. Ubuntu 24.10+ 의 sudo-rs 는 -E 를 무시해
      # 오버라이드(compose.fd.yml)가 빠진 채 docker-compose.yml 만으로 실행되고, --remove-orphans 가
      # proxy(Caddy)·qdrant 컨테이너를 고아로 지워 서비스가 내려간다. `sudo env VAR=... cmd` 로 넘긴다.
      - name: 컨테이너 재빌드 및 재기동
        run: |
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" \
            "cd '${APP_DIR}' \
             && sudo env COMPOSE_FILE='${COMPOSE_FILE}' docker compose config --quiet \
             && sudo env COMPOSE_FILE='${COMPOSE_FILE}' docker compose up -d --build --remove-orphans \
             && sudo docker image prune -f >/dev/null \
             && sudo env COMPOSE_FILE='${COMPOSE_FILE}' docker compose ps"

      # 운영 오버라이드(compose.fd.yml)는 앱 포트를 호스트에 노출하지 않으므로
      # 컨테이너 안에서 직접 확인한다 (이미지에 curl 포함).
      - name: 배포 확인 (app 컨테이너 내부 헬스체크)
        run: |
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" \
            "cd '${APP_DIR}' \
             && sudo env COMPOSE_FILE='${COMPOSE_FILE}' docker compose exec -T app \
                  curl -sf --retry 12 --retry-delay 5 --retry-all-errors http://localhost:8000/api/health" \
            && echo "app OK (container)"

      - name: 배포 확인 (퍼블릭 도메인, 설정된 경우)
        if: vars.FUND_WEB_DOMAIN != ''
        run: |
          curl -sf --retry 6 --retry-delay 5 --retry-all-errors \
            "https://${{ vars.FUND_WEB_DOMAIN }}/api/health" \
            && echo "public OK (${{ vars.FUND_WEB_DOMAIN }})"
